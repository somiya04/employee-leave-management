<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .navigation {
            text-align: center;
            margin-top: 20px;
        }

        .navigation a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Employee Management System</h1>
        <p>Edit Employee Details</p>
    </div>

    <div class="container">

        <h2>Update Employee</h2>

        <form method="POST">

            <label>Name:</label>
            <input
                type="text"
                name="name"
                value="{{ employee[1] }}"
                required
            >

            <label>Email:</label>
            <input
                type="email"
                name="email"
                value="{{ employee[2] }}"
                required
            >

            <label>Department:</label>
            <input
                type="text"
                name="department"
                value="{{ employee[3] }}"
                required
            >

            <button type="submit">Update Employee</button>

        </form>

        <div class="navigation">
            <a href="/employees">Back to Employees</a>
        </div>

    </div>

</body>
</html>
