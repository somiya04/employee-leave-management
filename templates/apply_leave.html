<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply Leave</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .navigation {
            text-align: center;
            margin-top: 20px;
        }

        .navigation a {
            text-decoration: none;
            color: #3498db;
            margin: 0 10px;
        }

        .navigation a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Employee Leave Management System</h1>
        <p>Apply for Leave</p>
    </div>

    <div class="container">

        <h2>Leave Application Form</h2>

        <form method="POST">

           <label>Select Employee:</label>
            <select name="employee_id" required>
    <option value="">Select Employee</option>

    {% for employee in employees %}
        <option value="{{ employee[0] }}">
            {{ employee[1] }}
        </option>
    {% endfor %}

</select>
  

            <label>Leave Type:</label>
            <select name="leave_type" required>
                <option value="Casual">Casual</option>
                <option value="Sick">Sick</option>
                <option value="Earned">Earned</option>
            </select>

            <label>Start Date:</label>
            <input type="date" name="start_date" required>

            <label>End Date:</label>
            <input type="date" name="end_date" required>

            <label>Reason:</label>
            <textarea name="reason" required></textarea>

            <button type="submit">Apply Leave</button>

        </form>

        <div class="navigation">
            <a href="/dashboard">Dashboard</a>
            <a href="/leave-requests">Leave Requests</a>
        </div>

    </div>

</body>
</html>
